name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check src tests

      - name: Test
        # This project's CLI (cua replay/discover/harden/validate) always
        # launches headed, not headless -- same-session human handoff is a
        # core requirement, not something to weaken just for CI (see
        # REPORT.md sec 1). xvfb-run gives it a virtual display instead.
        run: xvfb-run -a pytest -q
