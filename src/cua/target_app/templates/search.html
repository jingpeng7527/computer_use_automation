<!doctype html>
<html>
<head><title>Member Search</title></head>
<body>
<h1>Member Servicing Console</h1>
{% if not_found %}
<p>No member records match {{ not_found }}</p>
{% endif %}
<form method="post" action="/members/search">
  <table>
    <tr>
      <td>Member Number:</td>
      <td><input id="ext-gen-1029" name="member_id" type="text" /></td>
    </tr>
  </table>
  <button type="submit">Search</button>
</form>
</body>
</html>
