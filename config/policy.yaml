# Safety & policy guardrails (assignment 3.4).
# Loaded by both the discovery agent and the deterministic replay engine.
# Default posture: deny. Anything not explicitly allowed is refused.

allowlist:
  # The agent/replay may only navigate URLs whose origin is in this list.
  origins:
    - "http://127.0.0.1:8800"
    - "http://localhost:8800"
  # Only these URL path prefixes are in scope for automation.
  path_prefixes:
    - "/"
  # Action types the agent is permitted to emit at all.
  action_types:
    - navigate
    - click
    - type
    - select
    - read
    - wait

# Risk tiering (assignment 3.4). The EXECUTOR assigns a tier from the action
# type and target -- never accepted from the artifact's own risk_level hint,
# because otherwise a mislabelled step could downgrade its own risk.
risk_tiers:
  safe_read:
    action_types: [read, wait]
  reversible_write:
    action_types: [navigate, type, select, click]
  # Matching EITHER condition below marks an action irreversible, regardless
  # of its action type.
  irreversible:
    # accessible name / nearby text containing any of these phrases
    name_contains:
      - "confirm"
      - "submit"
      - "post transaction"
      - "delete"
      - "transfer"
      - "approve"
      - "change credit limit"
      - "close account"
    # a navigate destination matching any of these glob patterns
    path_patterns:
      - "/members/*/change-limit"
      - "/members/*/sub-account/confirm"

# What happens to an IRREVERSIBLE action:
#   refuse          - hard-refused, always, no unattended path
#   require_confirm - refused unattended, but escalates for human authorisation (sec 5)
# There is no "allow unattended" option: the consequences of an unauthorised
# irreversible action in a core banking system are not recoverable by retrying.
irreversible_policy: refuse

# Redaction: values matching these are never written to artifacts, logs, or evidence.
redaction:
  # Named regexes applied to all persisted strings.
  patterns:
    ssn: '\b\d{3}-\d{2}-\d{4}\b'
    email: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    long_number: '\b\d{9,}\b'          # account numbers, card numbers
    bearer_token: '(?i)bearer\s+[A-Za-z0-9._\-]+'
  # Field names whose values are always masked regardless of content.
  sensitive_field_names:
    - password
    - ssn
    - social_security_number
    - card_number
    - account_number
    - routing_number
    - token
    - authorization

# Execution bounds (assignment 3.4/6). An unbounded loop isn't just a cost
# problem -- it's repeatedly clicking a real back-office application.
# Enforced by the executor, shared by discovery and replay, never accepted
# from the artifact or decided by the model.
execution_bounds:
  max_steps: 25
  wall_clock_ceiling_s: 300
  per_wait_timeout_ms: 10000
  recovery_budget_per_run: 5
  no_progress_max_consecutive_steps: 3

# While a run is PAUSED awaiting a human operator (sec 5), the executor
# pings this route periodically so the target app's session doesn't expire
# out from under the handoff. Must be a SAFE_READ route.
keep_alive:
  route: "/members/search"
  interval_s: 60
