[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cua"
version = "0.1.0"
description = "Computer-use automation: LLM discovers a UI flow once, then deterministic replay invokes it as a reusable capability."
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.48",
    "pydantic>=2.9",
    "google-genai>=0.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
cua = "cua.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cua"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
